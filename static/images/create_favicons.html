<!DOCTYPE html>
<html>
<head>
<script>
// Create PNG versions from SVG using canvas
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <path d="M25 30 L15 50 L25 70" stroke="url(#codeGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M75 30 L85 50 L75 70" stroke="url(#codeGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="50" y1="25" x2="50" y2="75" stroke="url(#codeGradient)" stroke-width="5" stroke-linecap="round"/>
</svg>`;

function createPNG(size, filename) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0, size, size);
    canvas.toBlob(function(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
    });
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(svg);
}

// This would need to be run in browser console
console.log('Open browser console and run: createPNG(32, "favicon-32x32.png")');
</script>
</head>
<body>Open console</body>
</html>
